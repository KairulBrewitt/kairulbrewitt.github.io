# Builds TC Setup Lab: runs the physics tests and produces a debug APK.
# To enable, copy this file to .github/workflows/tc-setup-lab.yml
# Only runs when files of the tool change, so the Pages site is unaffected.
name: TC Setup Lab

on:
  push:
    paths:
      - 'tc-setup-lab/**'
      - '.github/workflows/tc-setup-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Physics tests
        run: node --test tc-setup-lab/tests/*.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: tc-setup-lab/android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: tc-setup-lab-debug-apk
          path: tc-setup-lab/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
